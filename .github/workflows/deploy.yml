name: Deploy

# Every push to main goes live. Manual "Run workflow" with rollback=true undoes the last deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback:
        description: "Roll back to the previous release instead of deploying"
        type: boolean
        default: false

permissions:
  contents: read

# One deploy at a time; a newer push waits for the running one instead of cutting it off.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          # Key is stored base64 (single line) so web-form pasting can't mangle it.
          # Drop anything outside the base64 alphabet (stray whitespace/quotes from pasting).
          CLEAN=$(printf '%s' "$DEPLOY_SSH_KEY_B64" | tr -cd 'A-Za-z0-9+/=')
          echo "secret length after cleaning: ${#CLEAN} characters (a correct key is 548)"
          [ -n "$CLEAN" ] || { echo "::error::DEPLOY_SSH_KEY_B64 is empty or not set"; exit 1; }
          printf '%s' "$CLEAN" | base64 -d > ~/.ssh/id_deploy || { echo "::error::DEPLOY_SSH_KEY_B64 is not valid base64"; exit 1; }
          chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy >/dev/null || { echo "::error::DEPLOY_SSH_KEY_B64 decodes but is not a valid private key"; exit 1; }
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host prod\n  HostName %s\n  User deploy\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  ServerAliveInterval 30\n' "$DEPLOY_HOST" > ~/.ssh/config

      - name: Roll back
        if: inputs.rollback
        run: ssh prod rollback

      - name: Build, ship, deploy
        if: "!inputs.rollback"
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          docker build -t "jctireshop-app:${SHA}" app     # a broken build stops here; live site untouched
          docker save "jctireshop-app:${SHA}" | gzip -1 | ssh prod "deploy ${SHA}"
